name: Deploy to GitHub Pages

# GitHub Pages は静的ホスティングのみで、AI採点API（/api/grade）が必要とする
# サーバーは動かせない。このワークフローは採点APIをビルドから除外した
# 静的エクスポート版を作って公開する。採点つきのフル機能を出す場合は
# Vercel など、サーバーレス関数が動くホスティングを使うこと（README参照）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # リポジトリでGitHub Pagesがまだ有効化されていない場合、pages: write権限を使って
      # このステップが自動で有効化する（Source: GitHub Actions として作成される）。
      # 「Settings → Pages」を手動で先に触らなくても、初回からデプロイが通るようにするため。
      # ビルドより前に置き、有効化できない場合（組織のポリシーなど）に早く気づけるようにする。
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # 採点APIはサーバー側でANTHROPIC_API_KEYを扱うため、静的エクスポートには含められない。
      # ここで取り除くのはCIのチェックアウトだけで、コミットされているソースはそのまま。
      - name: Remove server-only API route for static export
        run: rm -rf src/app/api

      - name: Build static export
        run: npm run build
        env:
          NEXT_STATIC_EXPORT: "true"
          NEXT_BASE_PATH: /${{ github.event.repository.name }}

      # GitHub Pages は既定でJekyllを通すため、_next/ のようにアンダースコアで
      # 始まるディレクトリを黙って除外してしまう。.nojekyll でそれを止める。
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
